<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S&O FEARLESS TAEKWONDO SPORTS CLUB</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #182848;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
    }

    input {
      width: 90%;
      padding: 14px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 14px 25px;
      background: #182848;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #304a80;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }

    .valid {
      background: #e8f8ee;
      color: #176b35;
    }

    .invalid {
      background: #ffeaea;
      color: #a11a1a;
    }
  </style>
</head>

<body>

<header>
  <h1>CertiVerify</h1>
  <p>Certificate Verification Portal</p>
</header>

<div class="container">

  <h2>Verify Your Certificate</h2>

  <p>Enter your certificate ID below</p>

  <input type="text" id="certificateId" placeholder="Enter Certificate ID">

  <br>

  <button onclick="verifyCertificate()">Verify Certificate</button>

  <div id="result"></div>

</div>

<script>

function verifyCertificate() {

  const id = document.getElementById("certificateId").value.trim();
  const result = document.getElementById("result");

  if (id === "") {
    result.style.display = "block";
    result.className = "invalid";
    result.innerHTML = "Please enter a Certificate ID.";
    return;
  }

  // Demo certificate data
  const certificates = {
    "CERT001": {
      name: "Example Student",
      course: "Web Development",
      date: "08 August 2026",
      status: "Valid"
    },

    "CERT002": {
      name: "Example User",
      course: "Computer Course",
      date: "08 August 2026",
      status: "Valid"
    }
  };

  if (certificates[id]) {

    const certificate = certificates[id];

    result.style.display = "block";
    result.className = "valid";

    result.innerHTML = `
      <h3>✓ Certificate Verified</h3>
      <p><strong>Name:</strong> ${certificate.name}</p>
      <p><strong>Course:</strong> ${certificate.course}</p>
      <p><strong>Date:</strong> ${certificate.date}</p>
      <p><strong>Status:</strong> ${certificate.status}</p>
    `;

  } else {

    result.style.display = "block";
    result.className = "invalid";

    result.innerHTML = `
      <h3>✕ Certificate Not Found</h3>
      <p>Please check your Certificate ID.</p>
    `;
  }
}

</script>

<div style="text-align:center; margin:25px;">
    <a href="owner.html"
       style="display:inline-block;
              background:#f5a623;
              color:#000;
              padding:12px 24px;
              border-radius:8px;
              text-decoration:none;
              font-weight:bold;">
        Owner / Coach Information
    </a>
</div>

</body>
</html>
