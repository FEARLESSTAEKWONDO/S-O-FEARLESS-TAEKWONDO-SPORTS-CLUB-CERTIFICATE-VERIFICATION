<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CertiVerify</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

header {
    background: #182848;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
}

header p {
    margin: 0;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    text-align: center;
}

input {
    width: 90%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 14px 25px;
    background: #182848;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #304a80;
}

#result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 10px;
    display: none;
}

.valid {
    background: #e8f8ee;
    color: #176b35;
}

.invalid {
    background: #ffeaea;
    color: #a11a1a;
}


/* OWNER INFORMATION BUTTON */

.owner-button {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 25px;
    background: #f5a623;
    color: #000;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
}

.owner-button:hover {
    background: #d99118;
}


/* FOOTER */

.footer {
    text-align: center;
    margin: 30px 0;
    color: #777;
    font-size: 14px;
}

</style>

</head>


<body>


<header>

<h1>CertiVerify</h1>

<p>Certificate Verification Portal</p>

</header>


<div class="container">


<h2>Verify Your Certificate</h2>

<p>Enter your certificate ID below</p>


<input
type="text"
id="certificateId"
placeholder="Enter Certificate ID"
>


<br>


<button onclick="verifyCertificate()">
Verify Certificate
</button>


<div id="result"></div>


<!-- OWNER INFORMATION -->

<a href="owner.html" class="owner-button">
Owner / Coach Information
</a>


</div>


<div class="footer">

© S&O Fearless Taekwondo Sports Club

</div>



<script>


function verifyCertificate() {


const id = document
.getElementById("certificateId")
.value
.trim();


const result = document.getElementById("result");


if (id === "") {


result.style.display = "block";

result.className = "invalid";

result.innerHTML =
"Please enter a Certificate ID.";

return;

}



/* CERTIFICATE DATA */

const certificates = {


"CERT001": {

name: "Example Student",

course: "Web Development",

date: "08 August 2026",

status: "Valid"

},


"CERT002": {

name: "Example User",

course: "Computer Course",

date: "08 August 2026",

status: "Valid"

}


};



/* VALID CERTIFICATE */

if (certificates[id]) {


const certificate = certificates[id];


result.style.display = "block";

result.className = "valid";


result.innerHTML = `

<h3>✓ Certificate Verified</h3>

<p>
<strong>Name:</strong>
${certificate.name}
</p>

<p>
<strong>Course:</strong>
${certificate.course}
</p>

<p>
<strong>Date:</strong>
${certificate.date}
</p>

<p>
<strong>Status:</strong>
${certificate.status}
</p>

`;


}


/* INVALID CERTIFICATE */

else {


result.style.display = "block";

result.className = "invalid";


result.innerHTML = `

<h3>✕ Certificate Not Found</h3>

<p>
Please check your Certificate ID.
</p>

`;

}

}


</script>


</body>

</html>
